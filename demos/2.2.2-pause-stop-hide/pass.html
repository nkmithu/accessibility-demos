<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passing example — 2.2.2 Pause, Stop, Hide</title>
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/example.css">
  <style>
    .ticker { overflow:hidden; border:1px solid var(--border); border-radius:6px; padding:.5rem; }
    .ticker span { display:inline-block; white-space:nowrap; animation: slide 6s linear infinite; }
    .ticker.paused span { animation-play-state: paused; }
    @keyframes slide { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
    .carousel { border:1px solid var(--border); border-radius:6px; padding:1rem; margin-top:1rem; }
    /* FIX: respect the user's operating system setting. Motion is removed, not
       just shortened - a fast lurch can be worse than a slow slide for someone
       with a vestibular disorder. */
    @media (prefers-reduced-motion: reduce) {
      .ticker span { animation: none; transform: none; }
    }
  </style>
</head>
<body class="example example--pass">
  <p class="example-banner">This page MEETS WCAG 2.2.2 Pause, Stop, Hide.</p>

  <!-- excerpt:start -->
  <h1>Riverline Books</h1>

  <!-- FIX 1: a real pause control, reachable by keyboard, placed before the
       moving content so it is found before the motion becomes a problem.
       aria-pressed exposes the state. -->
  <p>
    <button type="button" class="button button--secondary" id="ticker-toggle"
            aria-pressed="false" onclick="toggleTicker(this)">Pause the news ticker</button>
  </p>
  <div class="ticker" id="ticker">
    <span>Spring festival tickets on sale now — members save 20% — free delivery over £25 —</span>
  </div>

  <!-- FIX 2: no blinking at all. Emphasis is carried by text and weight, which
       nobody has to switch off. -->
  <p><strong>Offer ends 30 September.</strong></p>

  <!-- FIX 3: the carousel starts paused and the user starts it, which is the
       safest default. If it must auto-play, the pause control has to be
       available before it starts moving. -->
  <p>
    <button type="button" class="button button--secondary" id="carousel-toggle"
            aria-pressed="false" onclick="toggleCarousel(this)">Play staff picks slideshow</button>
  </p>
  <div class="carousel">
    <h2>Staff picks</h2>
    <p id="slide">Tidal Flats, by A. Marsh</p>
  </div>

  <!-- FIX 4: the auto-updating figure can be frozen. Note the exception 2.2.2
       allows: content that is part of an activity where the movement is
       essential - a progress bar, a live sports score the user asked for - is
       exempt. Decoration never is. -->
  <p>
    Baskets checked out in the last hour: <span id="count" role="status">14</span>
    <button type="button" class="button button--secondary" id="count-toggle"
            aria-pressed="false" onclick="toggleCount(this)">Stop updating this figure</button>
  </p>
  <!-- excerpt:end -->

  <script>
    var picks = ['Tidal Flats, by A. Marsh', 'The Long Field, by R. Owen', 'Salt, by J. Nandi'];
    var i = 0, slideTimer = null, countTimer = null;

    function press(btn, on, labelOn, labelOff) {
      btn.setAttribute('aria-pressed', String(on));
      btn.textContent = on ? labelOn : labelOff;
    }
    function toggleTicker(btn) {
      var on = btn.getAttribute('aria-pressed') !== 'true';
      document.getElementById('ticker').classList.toggle('paused', on);
      press(btn, on, 'Play the news ticker', 'Pause the news ticker');
    }
    function toggleCarousel(btn) {
      var on = btn.getAttribute('aria-pressed') !== 'true';
      if (on) {
        slideTimer = setInterval(function () {
          i = (i + 1) % picks.length;
          document.getElementById('slide').textContent = picks[i];
        }, 2500);
      } else { clearInterval(slideTimer); }
      press(btn, on, 'Pause staff picks slideshow', 'Play staff picks slideshow');
    }
    function toggleCount(btn) {
      var on = btn.getAttribute('aria-pressed') !== 'true';
      if (on) { clearInterval(countTimer); countTimer = null; }
      else {
        countTimer = setInterval(function () {
          document.getElementById('count').textContent = 14 + Math.floor(Math.random() * 9);
        }, 3000);
      }
      press(btn, on, 'Resume updating this figure', 'Stop updating this figure');
    }
    countTimer = setInterval(function () {
      document.getElementById('count').textContent = 14 + Math.floor(Math.random() * 9);
    }, 3000);
  </script>
</body>
</html>
