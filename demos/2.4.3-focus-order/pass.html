<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passing example — 2.4.3 Focus Order</title>
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/example.css">
  <style>
    .modal { border:2px solid #6d7883; border-radius:8px; padding:1rem; background:#fff;
             max-width:22rem; margin-top:1rem; }
  </style>
</head>
<body class="example example--pass">
  <p class="example-banner">This page MEETS WCAG 2.4.3 Focus Order.
     Tab order follows the visual order, and the dialog manages focus.</p>

  <!-- excerpt:start -->
  <h1>Contact us</h1>

  <!-- FIX 1: no tabindex at all. The DOM order already matches the visual order,
       so the browser's natural focus order is correct. This is the goal: if you
       need tabindex to fix your focus order, fix your DOM instead. -->
  <form>
    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" autocomplete="name">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email">
    </div>
    <div class="field">
      <label for="msg">Message</label>
      <textarea id="msg"></textarea>
    </div>
    <button type="submit" class="button">Send</button>
  </form>

  <!-- FIX 2: the dialog moves focus in when it opens and returns it to the
       trigger when it closes, so the keyboard user never loses their place.
       Escape closes it (2.1.2 No Keyboard Trap). -->
  <p><button type="button" class="button button--secondary" id="open-help">Open help</button></p>

  <div class="modal" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-h" hidden>
    <h2 id="dlg-h" tabindex="-1">Help</h2>
    <p>We reply within two working days.</p>
    <button type="button" class="button" id="close-help">Close</button>
  </div>
  <!-- excerpt:end -->

  <script>
    var opener = document.getElementById('open-help');
    var dlg = document.getElementById('dlg');
    var closer = document.getElementById('close-help');

    opener.addEventListener('click', function () {
      dlg.hidden = false;
      // Focus the dialog's heading, so its name is announced on arrival.
      document.getElementById('dlg-h').focus();
    });

    function close() {
      dlg.hidden = true;
      opener.focus();   // return focus to where the user left it
    }
    closer.addEventListener('click', close);
    dlg.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { close(); }
    });
  </script>
</body>
</html>
