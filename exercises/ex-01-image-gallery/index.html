<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise 1 — Image gallery</title>
<link rel="stylesheet" href="../exercise.css">
</head>
<body>
<p class="task"><strong>Exercise 1.</strong> Fix the text alternatives on this page.
   See <code>README.md</code> for the acceptance criteria.</p>

<h1>Our shops</h1>

<!-- 1. An informative photograph. -->
<img src="../../assets/media/book-cover.svg" width="120" height="170">

<h2>Riverside</h2>
<p>Our first shop, opened in 1998.</p>

<!-- 2. A purely decorative divider. -->
<img src="../../assets/media/divider.svg" alt="a decorative line graphic used as a divider between sections"
     width="320" height="8">

<!-- 3. An icon-only button. -->
<button type="button" class="btn">
  <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
    <path d="M10 3a7 7 0 0 1 6.3 10.05l-.3.55 3 3-1.4 1.4-3-3A7 7 0 1 1 10 3Zm0 2a5 5 0 1 0 0 10A5 5 0 0 0 10 5Z"/>
  </svg>
</button>

<!-- 4. A chart carrying data. -->
<img src="../../assets/media/sales-chart.svg" alt="chart" width="360" height="200">

<!-- 5. A logo that is also the link back to the home page. -->
<p><a href="#home"><img src="../../assets/media/award-badge.svg" alt="badge" width="60" height="60"></a></p>

<p id="home">Home.</p>
</body>
</html>
