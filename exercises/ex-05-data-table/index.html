<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise 5 — Data table</title>
<link rel="stylesheet" href="../exercise.css">
</head>
<body>
<p class="task"><strong>Exercise 5.</strong> Make this table readable with a screen reader.
   See <code>README.md</code>.</p>

<h1>Stock by branch</h1>

<!-- Every cell is a td. There is no caption, no thead, no scope. -->
<table>
  <tr>
    <td><b>Title</b></td><td><b>Riverside</b></td><td><b>Old Town</b></td><td><b>Hillgate</b></td>
  </tr>
  <tr><td>Tidal Flats</td><td>12</td><td>4</td><td>0</td></tr>
  <tr><td>The Long Field</td><td>3</td><td>9</td><td>7</td></tr>
  <tr><td>Salt</td><td>0</td><td>2</td><td>11</td></tr>
</table>

<h2>Opening hours</h2>
<!-- A layout table used for presentation, exposed as a data table. -->
<table>
  <tr>
    <td>Weekdays<br>9am – 6pm</td>
    <td>Saturday<br>10am – 4pm</td>
  </tr>
</table>
</body>
</html>
